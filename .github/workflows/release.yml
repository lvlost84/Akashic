# 버전 태그(v2.0.1 등)를 올리면 빌드해서 GitHub Releases에 Akashic.exe + SHA256SUMS를 올린다.
# 앱의 자동 업데이트는 이 두 파일을 받아 해시를 확인한 뒤 설치한다.
# main에 올릴 때도 시험·빌드만 돌려 라이브러리 캐시를 만든다(태그 실행은 다른 태그의 캐시를 못 쓰고 main의 캐시만 쓸 수 있어서).
name: release
on:
  push:
    branches: [main]
    # 문서(.md)만 바뀐 푸시는 빌드하지 않는다. 태그 푸시에는 경로 조건이 적용되지 않아 릴리스는 항상 돈다.
    paths-ignore: ["**.md"]
    tags: ["v*"]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: 라이브러리 빌드 캐시
        uses: Swatinem/rust-cache@v2
      - name: 태그와 Cargo.toml 버전이 같은지 확인
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}".TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1).Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "태그($tag)와 Cargo.toml 버전($ver)이 다릅니다" }
      - name: 시험
        run: cargo test --release
      - name: 빌드
        env:
          AKASHIC_REPO: ${{ github.repository }}
        run: cargo build --release
      - name: 올릴 파일 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item target/release/akashic.exe dist/Akashic.exe
          $h = (Get-FileHash dist/Akashic.exe -Algorithm SHA256).Hash.ToLower()
          "$h  Akashic.exe" | Out-File -Encoding ascii -NoNewline dist/SHA256SUMS
          if (Test-Path THIRD-PARTY-LICENSES.md) { Copy-Item THIRD-PARTY-LICENSES.md dist/THIRD-PARTY-LICENSES.md }
      - name: MCP 번들(.mcpb) 준비
        # 번들 버전은 mcpb/version.txt다. 같은 버전의 번들이 이미 올라간 릴리스가 있으면 그 파일을 그대로 내려받아 첨부하고(내용이 바뀌지 않는다),
        # 없을 때만(MCP 도구가 바뀌어 버전을 올렸을 때) 방금 빌드한 exe로 새로 만든다. 실패해도 exe 릴리스는 계속 만든다.
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $ver = (Get-Content mcpb/version.txt -Raw).Trim()
          $name = "akashic-$ver.mcpb"
          New-Item -ItemType Directory -Force dist | Out-Null
          $tags = @(gh release list --limit 100 --json tagName --jq '.[].tagName')
          foreach ($t in $tags) {
            $assets = @(gh release view $t --json assets --jq '.assets[].name')
            if ($assets -contains $name) {
              gh release download $t --pattern $name --dir dist
              Write-Host "이전 릴리스 $t 의 $name 을 그대로 첨부합니다"
              break
            }
          }
          if (-not (Test-Path "dist/$name")) {
            ./mcpb/pack.ps1 -SkipBuild
            Copy-Item "out/$name" "dist/$name"
            Write-Host "$name 을 새로 만들었습니다"
          }
      - name: 릴리스 만들기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = @("dist/Akashic.exe", "dist/SHA256SUMS")
          if (Test-Path dist/THIRD-PARTY-LICENSES.md) { $files += "dist/THIRD-PARTY-LICENSES.md" }
          Get-ChildItem dist -Filter *.mcpb -ErrorAction SilentlyContinue | ForEach-Object { $files += "dist/$($_.Name)" }
          gh release create "${{ github.ref_name }}" @files --title "아카식 ${{ github.ref_name }}" --generate-notes
