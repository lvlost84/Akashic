[package]
name = "akashic"
version = "2.11.1"
edition = "2024"

[dependencies]
ttf-parser = "0.25"
chrono = { version = "0.4.45", features = ["clock"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "wgpu", "accesskit", "clipboard", "default_fonts", "links"] }
encoding_rs = "0.8.44"
rfd = "0.18.0"
rusqlite = { version = "0.42.0", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
webp = "0.3.1"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "bmp", "gif", "webp"] }
chacha20poly1305 = "0.11.0"
hkdf = "0.13.0"
hmac = "0.13.0"
getrandom = "0.4.3"
diffy = "0.5.2"
flate2 = "1.1.11"

[build-dependencies]
# LICENSE.md를 빌드 때 만들기 위한 cargo metadata 해석(이미 쓰는 크레이트라 새 크레이트는 늘지 않는다)
serde_json = "1.0.154"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[dev-dependencies]
fastrand = "2.5.0"

